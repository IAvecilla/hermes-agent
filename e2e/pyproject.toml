[project]
name = "hermes-e2e"
version = "0.1.0"
description = "End-to-end integration tests for Hermes Agent messaging platforms"
requires-python = ">=3.11"
dependencies = [
    # Telegram: telethon acts as a real user (MTProto client)
    "telethon>=1.36.0,<2",
    # Discord: second bot as test driver
    "discord.py>=2.7.1,<3",
    # Slack: SDK for sending messages and reading history
    "slack-sdk>=3.27.0,<4",
    # Test framework
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-timeout>=2.3,<3",
    # Utilities
    "python-dotenv>=1.0,<2",
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
markers = [
    "telegram: Telegram integration tests",
    "discord: Discord integration tests",
    "slack: Slack integration tests",
    "all_platforms: Tests that run on all platforms",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"
